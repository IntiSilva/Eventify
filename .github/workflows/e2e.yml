name: E2E (Playwright)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-neon-shared
  cancel-in-progress: true

jobs:
  e2e:
    environment: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Ensure auth folder exists
        run: mkdir -p e2e/.auth

      - name: Create .env.e2e (CI)
        shell: bash
        run: |
          cat > .env.e2e << 'EOF'
          NODE_ENV=${{ vars.NODE_ENV }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}

          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET=${{ secrets.CLERK_WEBHOOK_SECRET }}

          NEXT_PUBLIC_FEATURED_THRESHOLD=${{ vars.NEXT_PUBLIC_FEATURED_THRESHOLD }}
          FEATURED_THRESHOLD=${{ vars.FEATURED_THRESHOLD }}

          NEXT_PUBLIC_E2E=${{ vars.NEXT_PUBLIC_E2E }}
          PW_INTERACTIVE=${{ vars.PW_INTERACTIVE }}

          E2E_FRESH_EMAIL=${{ secrets.E2E_FRESH_EMAIL }}
          E2E_FRESH_PASSWORD=${{ secrets.E2E_FRESH_PASSWORD }}
          E2E_FRESH_USERNAME=${{ secrets.E2E_FRESH_USERNAME }}

          E2E_USER_EMAIL=${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD=${{ secrets.E2E_USER_PASSWORD }}
          E2E_USER_USERNAME=${{ secrets.E2E_USER_USERNAME }}

          E2E_ORG_EMAIL=${{ secrets.E2E_ORG_EMAIL }}
          E2E_ORG_PASSWORD=${{ secrets.E2E_ORG_PASSWORD }}
          E2E_ORG_USERNAME=${{ secrets.E2E_ORG_USERNAME }}
          E2E_ORG_PHONE=${{ secrets.E2E_ORG_PHONE }}

          E2E_ADMIN_EMAIL=${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD=${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_ADMIN_USERNAME=${{ secrets.E2E_ADMIN_USERNAME }}
          E2E_ADMIN_PHONE=${{ secrets.E2E_ADMIN_PHONE }}
          EOF


      - name: Reset + Seed E2E DB
        run: npm run pree2e

      - name: Run Playwright
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
